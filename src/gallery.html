<header class="site-header" id="top">
  <a class="logo" href="index.html">SAMUEL KACEJ</a>
  <button class="burger" id="burger" aria-label="Menu" aria-expanded="false"><span></span><span></span></button>

  <p class="lb-caption" id="lb-caption"></p>

<div id="panoviewer" class="panoviewer" hidden>
  <button class="lb-btn lb-close" id="pano-close" aria-label="Close">×</button>
